name: Render profile metrics ✨

on:
  schedule:
    - cron: "17 */6 * * *" # 6 tiếng render 1 lần
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/render-metrics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Render metrics SVG
        run: node scripts/render-metrics.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_USER: toan-05

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.svg assets/metrics.json
          git diff --cached --quiet || (git commit -m "chore: auto-render metrics ✨ $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
